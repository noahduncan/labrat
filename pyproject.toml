[project]
name = "labrat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.1",
    "labrat-client",
    "requests>=2.34.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
labrat-client = { workspace = true }

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "time-machine>=3.5.1",
]

[tool.ruff.lint]
extend-select = ["DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "labrat.settings"
#testpaths=["packages"]
